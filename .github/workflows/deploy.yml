name: Deploy to GitHub Pages

# Deploys to https://trackedout.app/, via the custom domain set on the Pages
# site. wemps.github.io/trackedout-website/ redirects there.
#
# public/CNAME ships into dist/, and Pages reads it out of the deployed artifact
# and adopts it as the custom domain. That makes the domain a property of the
# build, which is only safe while DNS already points at Pages — the apex is on
# 185.199.108-111.153. If the domain ever has to be given up, deleting this file
# is not enough: Pages keeps a domain it has already adopted, so it also has to
# be cleared with
# `gh api -X PUT repos/Wemps/trackedout-website/pages --input <<< '{"cname": null}'`.
#
# Setting the domain ahead of DNS doesn't fail loudly. Pages just starts
# redirecting the github.io URL to a domain it doesn't serve yet, and the
# deployed site goes unreachable at both addresses.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
